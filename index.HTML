<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario CCTV & Proyectos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e9ecef; font-family: sans-serif; }
        .container { max-width: 700px; margin-top: 20px; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn-add { background-color: #28a745; color: white; border: none; }
        .btn-add:hover { background-color: #218838; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="card p-4">
        <h2 class="text-center mb-4">🛡️ Inventario de Seguridad y Redes</h2>
        
        <div class="row g-2 mb-3">
            <div class="col-12">
                <input type="text" id="producto" class="form-control" placeholder="Equipo (Cámara, Router, Sensor...)">
            </div>
            <div class="col-6">
                <input type="number" id="cantidad" class="form-control" placeholder="Cantidad">
            </div>
            <div class="col-6">
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" id="precio" class="form-control" placeholder="Precio Venta">
                </div>
            </div>
            <div class="col-12">
                <button onclick="agregarItem()" class="btn btn-add w-100 fw-bold">Guardar en Inventario</button>
            </div>
        </div>

        <hr>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Producto</th>
                        <th>Cant.</th>
                        <th>Precio Unit.</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="listaInventario">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', mostrarInventario);

    function agregarItem() {
        const nombre = document.getElementById('producto').value;
        const cantidad = document.getElementById('cantidad').value;
        const precio = document.getElementById('precio').value;

        if (!nombre || !cantidad || !precio) {
            alert("Por favor, completa todos los campos (Nombre, Cantidad y Precio)");
            return;
        }

        const nuevoItem = { 
            nombre, 
            cantidad: parseInt(cantidad), 
            precio: parseFloat(precio) 
        };
        
        let inventario = JSON.parse(localStorage.getItem('inventario')) || [];
        inventario.push(nuevoItem);
        localStorage.setItem('inventario', JSON.stringify(inventario));

        // Limpiar formulario
        document.getElementById('producto').value = '';
        document.getElementById('cantidad').value = '';
        document.getElementById('precio').value = '';
        
        mostrarInventario();
    }

    function mostrarInventario() {
        const tabla = document.getElementById('listaInventario');
        tabla.innerHTML = '';
        const inventario = JSON.parse(localStorage.getItem('inventario')) || [];

        inventario.forEach((item, index) => {
            tabla.innerHTML += `
                <tr>
                    <td class="fw-bold">${item.nombre}</td>
                    <td>${item.cantidad}</td>
                    <td>$${item.precio.toLocaleString()}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarItem(${index})">🗑️</button>
                    </td>
                </tr>
            `;
        });
    }

    function eliminarItem(index) {
        if(confirm("¿Estás seguro de eliminar este equipo?")) {
            let inventario = JSON.parse(localStorage.getItem('inventario'));
            inventario.splice(index, 1);
            localStorage.setItem('inventario', JSON.stringify(inventario));
            mostrarInventario();
        }
    }
</script>

</body>
</html>
