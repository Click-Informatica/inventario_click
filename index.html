<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Informática & CISS CCTV</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --azul-click: #0a3d4d; --verde-ciss: #14828a; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--light); }
        .navbar { background: white; border-bottom: 3px solid var(--azul-click); }
        .hero { background: linear-gradient(135deg, var(--azul-click) 0%, var(--verde-ciss) 100%); color: white; padding: 40px 0; text-align: center; }
        
        /* Botones de Servicios Grandes */
        .service-btn { 
            background: white; border: none; border-radius: 15px; padding: 25px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: 0.3s; width: 100%; text-align: left;
            margin-bottom: 15px;
        }
        .service-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .service-icon { font-size: 2rem; color: var(--verde-ciss); margin-bottom: 10px; }
        
        /* Sub-botones de Categoría */
        .sub-cat-btn {
            background: #e9ecef; border: none; border-radius: 10px; padding: 10px 20px;
            font-weight: 600; color: var(--azul-click); transition: 0.2s;
        }
        .sub-cat-btn:hover { background: var(--verde-ciss); color: white; }

        /* Estilo de los productos vacíos */
        .product-card { border: none; border-radius: 15px; background: white; height: 100%; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .img-placeholder { height: 180px; background: #eee; display: flex; align-items: center; justify-content: center; border-radius: 15px 15px 0 0; color: #ccc; }
        
        #admin-panel { display: none; background: #fff; border: 2px dashed var(--verde-ciss); border-radius: 20px; padding: 25px; margin-bottom: 30px; }
        .whatsapp-btn { position: fixed; bottom: 25px; right: 25px; background: #25d366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; text-decoration: none; }
    </style>
</head>
<body>

<nav class="navbar sticky-top px-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand fw-bold" href="#" style="color: var(--azul-click)">🛡️ CLICK | CISS</a>
        <button onclick="toggleAdmin()" class="btn btn-sm btn-light rounded-circle"><i class="bi bi-gear"></i></button>
    </div>
</nav>

<header class="hero">
    <div class="container">
        <h1 class="display-6 fw-bold">Soluciones Tecnológicas</h1>
        <p class="opacity-75">Andresito, Misiones</p>
    </div>
</header>

<div class="container my-5">
    
    <h4 class="fw-bold mb-4">Áreas de Servicio</h4>
    <div class="row g-3">
        <div class="col-md-4">
            <button class="service-btn" data-bs-toggle="collapse" data-bs-target="#sub-seguridad">
                <div class="service-icon"><i class="bi bi-shield-lock"></i></div>
                <h5 class="fw-bold m-0">CCTV y Seguridad</h5>
                <small class="text-muted">Cámaras, Cercos, Alarmas</small>
            </button>
        </div>
        <div class="col-md-4">
            <button class="service-btn" data-bs-toggle="collapse" data-bs-target="#sub-informatica">
                <div class="service-icon"><i class="bi bi-pc-display"></i></div>
                <h5 class="fw-bold m-0">Informática</h5>
                <small class="text-muted">Soporte, Ventas y Servidores</small>
            </button>
        </div>
        <div class="col-md-4">
            <button class="service-btn" data-bs-toggle="collapse" data-bs-target="#sub-redes">
                <div class="service-icon"><i class="bi bi-wifi"></i></div>
                <h5 class="fw-bold m-0">Redes y Enlaces</h5>
                <small class="text-muted">WiFi Alta Escala y Puntos a Punto</small>
            </button>
        </div>
    </div>

    <div class="collapse mt-4" id="sub-seguridad">
        <div class="card card-body border-0 shadow-sm rounded-4">
            <h6 class="fw-bold mb-3 text-uppercase" style="color: var(--verde-ciss)">Seleccione Sub-Categoría:</h6>
            <div class="d-flex flex-wrap gap-2">
                <button class="sub-cat-btn" onclick="filtrar('Cámaras Analógicas')">Cámaras Analógicas</button>
                <button class="sub-cat-btn" onclick="filtrar('Cámaras IP')">Cámaras IP</button>
                <button class="sub-cat-btn" onclick="filtrar('Cámaras WiFi')">Cámaras WiFi</button>
                <button class="sub-cat-btn" onclick="filtrar('Grabadores')">Grabadores</button>
                <button class="sub-cat-btn" onclick="filtrar('Almacenamiento')">Almacenamiento</button>
                <button class="sub-cat-btn" onclick="filtrar('Accesorios')">Accesorios CCTV</button>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="mt-4">
        <h5 class="fw-bold mb-3">Panel Admin - Cargar Ítem</h5>
        <div class="row g-2">
            <div class="col-md-4"><input type="text" id="p-nombre" class="form-control" placeholder="Descripción del artículo"></div>
            <div class="col-md-2"><input type="number" id="p-precio" class="form-control" placeholder="Precio (opcional)"></div>
            <div class="col-md-3">
                <select id="p-cat" class="form-select">
                    <option value="Cámaras Analógicas">Cámaras Analógicas</option>
                    <option value="Cámaras IP">Cámaras IP</option>
                    <option value="Cámaras WiFi">Cámaras WiFi</option>
                    <option value="Grabadores">Grabadores</option>
                    <option value="Almacenamiento">Almacenamiento</option>
                    <option value="Accesorios">Accesorios</option>
                    <option value="Informática">Informática</option>
                </select>
            </div>
            <div class="col-md-3"><input type="text" id="p-foto" class="form-control" placeholder="URL de la Foto (opcional)"></div>
            <div class="col-12 mt-2"><button onclick="subirProducto()" class="btn btn-success w-100 fw-bold">PUBLICAR ARTÍCULO</button></div>
        </div>
    </div>

    <hr class="my-5">

    <h4 id="titulo-catalogo" class="fw-bold mb-4">Catálogo General</h4>
    <div id="lista-productos" class="row g-4">
        </div>
</div>

<a href="https://wa.me/5493757601349" class="whatsapp-btn shadow" target="_blank"><i class="bi bi-whatsapp"></i></a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDqP1Q3cm1KxxGgqAHUfKJXFq9HWWS3Q5k",
        authDomain: "click-ciss-web.firebaseapp.com",
        projectId: "click-ciss-web",
        storageBucket: "click-ciss-web.firebasestorage.app",
        messagingSenderId: "503933085382",
        appId: "1:503933085382:web:2c02acd276f7d7e96819c7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "inventario");

    // ARTICULOS MAESTROS (CARGA INICIAL SIN PRECIO NI FOTO)
    const articulosBase = [
        { nombre: "Cámara Hilook Domo Turbo HD THC-T110-P (720p)", cat: "Cámaras Analógicas" },
        { nombre: "Cámara Hikvision Domo DS-2CE56COT-IRP", cat: "Cámaras Analógicas" },
        { nombre: "Cámara Hilook Bullet Turbo HD THC-B110-P", cat: "Cámaras Analógicas" },
        { nombre: "Cámara IP Ezviz H3C Color (Full HD Wifi)", cat: "Cámaras WiFi" },
        { nombre: "DVR Hilook DVR-116G-M1 (16 CH)", cat: "Grabadores" },
        { nombre: "NVR Hikvision DS-7616NI-Q2 (16 CH, 4K)", cat: "Grabadores" },
        { nombre: "Disco Rígido Seagate 1TB Skyhawk Surveillance", cat: "Almacenamiento" },
        { nombre: "Balun Pasivo Hikvision DS-1H18S-E (Par)", cat: "Accesorios" }
    ];

    window.subirProducto = async () => {
        const nombre = document.getElementById('p-nombre').value;
        const precio = document.getElementById('p-precio').value || 0;
        const cat = document.getElementById('p-cat').value;
        const foto = document.getElementById('p-foto').value || "";
        if(nombre) {
            await addDoc(colRef, { nombre, precio, cat, foto, fecha: new Date() });
            alert("Artículo cargado");
        }
    };

    onSnapshot(query(colRef, orderBy("fecha", "desc")), (snapshot) => {
        const contenedor = document.getElementById('lista-productos');
        contenedor.innerHTML = '';
        
        // Unimos los base + los de firebase para que no falte nada
        let todos = [...articulosBase];
        snapshot.forEach(d => todos.unshift({ ...d.data(), id: d.id }));

        todos.forEach((p) => {
            const displayPrecio = p.precio > 0 ? `$${p.precio}` : "Consultar";
            const imgHtml = p.foto ? `<img src="${p.foto}">` : `<div class="img-placeholder"><i class="bi bi-camera" style="font-size:3rem"></i></div>`;
            
            contenedor.innerHTML += `
                <div class="col-md-3 product-item" data-cat="${p.cat}">
                    <div class="card product-card">
                        <div class="img-container" style="height:180px; overflow:hidden;">${imgHtml}</div>
                        <div class="card-body">
                            <small class="text-muted">${p.cat}</small>
                            <h6 class="fw-bold mb-2" style="font-size: 0.9rem">${p.nombre}</h6>
                            <p class="text-primary fw-bold mb-3">${displayPrecio}</p>
                            <a href="https://wa.me/5493757601349?text=Hola, precio de: ${p.nombre}" target="_blank" class="btn btn-outline-success btn-sm w-100">Consultar</a>
                            ${p.id ? `<button onclick="eliminar('${p.id}')" class="btn btn-link text-danger btn-sm w-100 admin-only" style="display:none">Borrar</button>` : ''}
                        </div>
                    </div>
                </div>`;
        });
    });

    window.filtrar = (cat) => {
        document.getElementById('titulo-catalogo').innerText = "Viendo: " + cat;
        document.querySelectorAll('.product-item').forEach(item => {
            item.style.display = item.getAttribute('data-cat') === cat ? 'block' : 'none';
        });
    };

    window.eliminar = async (id) => { if(confirm("¿Borrar?")) await deleteDoc(doc(db, "inventario", id)); };
</script>

<script>
    function toggleAdmin() {
        if(prompt("Clave:") === "1234") {
            document.getElementById('admin-panel').style.display = 'block';
            document.querySelectorAll('.admin-only').forEach(e => e.style.display = 'block');
        }
    }
</script>
</body>
</html>
